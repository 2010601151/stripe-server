<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout – Taste Liberia</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Poppins', sans-serif; background-color: #fffaf5; color: #333; margin:0; padding:0; }
header { background-color: #2E6F40; color:#fff; padding:15px 20px; position:sticky; top:0; z-index:1000; }
header .header-container { max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; }
header nav a { color:#fff; margin:0 10px; font-weight:600; }
header nav a:hover { color:#ffe4b3; }
h1,h2,h3,h4 { margin-bottom:15px; }
.container { max-width:1000px; margin:40px auto; padding:0 20px; }
table { width:100%; border-collapse:collapse; margin-bottom:20px; }
table th, table td { padding:10px; border-bottom:1px solid #ddd; text-align:left; }
table th { background-color:#2E6F40; color:#fff; }
input[type=number] { width:60px; padding:5px; }
button.btn { padding:12px 25px; background-color:#2E6F40; color:#fff; border:none; border-radius:50px; cursor:pointer; font-weight:600; transition:all 0.3s; }
button.btn:hover { background-color:#ff9933; }
</style>
</head>
<body>

<header>
  <div class="header-container">
    <img src="logo.jpeg" alt="Taste Liberia Logo" style="width:60px; border-radius:50%;">
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="checkout.html">Order</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<div class="container">
  <h1>Your Cart</h1>
  <table>
    <thead>
      <tr>
        <th>Item</th>
        <th>Qty</th>
        <th>Price</th>
        <th>Remove</th>
      </tr>
    </thead>
    <tbody id="cart-body"></tbody>
  </table>
  <h2>Total: $<span id="cart-total">0</span></h2>
  <button class="btn" onclick="checkout()">Pay with Card</button>
</div>

<script src="https://js.stripe.com/v3/"></script>
<script>
let cart = JSON.parse(localStorage.getItem('cart')) || [];

function renderCart() {
  const cartBody = document.getElementById('cart-body');
  cartBody.innerHTML = '';
  let total = 0;

  cart.forEach((item, i) => {
    total += item.price * item.quantity;
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${item.name}</td>
      <td><input type="number" min="1" value="${item.quantity}" onchange="updateQty(${i}, this.value)"></td>
      <td>$${(item.price * item.quantity).toFixed(2)}</td>
      <td><button onclick="removeItem(${i})">❌</button></td>
    `;
    cartBody.appendChild(row);
  });

  document.getElementById('cart-total').innerText = total.toFixed(2);
  localStorage.setItem('cart', JSON.stringify(cart));
}

function updateQty(i, value) {
  cart[i].quantity = parseInt(value);
  renderCart();
}

function removeItem(i) {
  cart.splice(i, 1);
  renderCart();
}

async function checkout() {
  if (cart.length === 0) {
    alert("Your cart is empty!");
    return;
  }

  try {
    // Replace this URL with your Render backend URL
    const response = await fetch("const response = await fetch("https://stripe-server-xg4i.onrender.com/create-checkout-session", {
", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cartItems: cart })
    });

    const session = await response.json();
    console.log("Stripe Session:", session);

    if (!session.id) {
      throw new Error("Failed to create Stripe session");
    }

    // Replace with your LIVE Stripe publishable key
    const stripe = Stripe("pk_live_51SLPuYIRB5h9kKSgqV6JOB9LWX6CcoSql3aNbFIzpabBCBBU2pzct7QLi7EaBZ3HNhzdgiEtxpG3kqPHD06kDXfQ00S6lRKCOq"); 
    await stripe.redirectToCheckout({ sessionId: session.id });

  } catch (error) {
    console.error(error);
    alert("Payment failed. Please try again.");
  }
}

renderCart();
</script>
</body>
</html>
